[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-perf-lab"
version = "0.1.0"
description = "Optimization experiments with explicit correctness checks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["proof_perf_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
